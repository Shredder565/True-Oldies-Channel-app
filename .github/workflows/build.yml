name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w -H windowsgui" -o TrueOldiesChannel-Windows-x64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: TrueOldiesChannel-Windows-x64
          path: TrueOldiesChannel-Windows-x64.exe
