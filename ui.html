<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>True Oldies Channel</title>
<style>
  :root {
    --wood1: #6b3a1e; --wood2: #8a4b26; --wood3: #4a2612;
    --brass: #d8b25a; --brass2: #8c6a22;
    --glow: #ffb347;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15110d; font-family: Georgia, "Times New Roman", serif; }
  body { display: flex; align-items: center; justify-content: center; }

  /* ---------- Cabinet ---------- */
  .cabinet {
    position: relative; width: 640px; height: 420px;
    border-radius: 34px 34px 18px 18px;
    background:
      repeating-linear-gradient(92deg, rgba(0,0,0,.10) 0 2px, transparent 2px 7px, rgba(255,255,255,.04) 7px 9px, transparent 9px 17px),
      repeating-linear-gradient(88deg, rgba(0,0,0,.06) 0 1px, transparent 1px 4px),
      linear-gradient(180deg, var(--wood2) 0%, var(--wood1) 45%, var(--wood3) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,220,170,.25),
      inset 0 -6px 12px rgba(0,0,0,.6),
      0 30px 60px rgba(0,0,0,.8), 0 4px 10px rgba(0,0,0,.6);
    padding: 26px 28px 22px;
    border: 2px solid #2b170b;
  }
  .cabinet::before { /* veneer highlight */
    content:""; position:absolute; inset:6px; border-radius: 28px 28px 14px 14px;
    border: 1px solid rgba(255,215,160,.18); pointer-events:none;
  }

  /* ---------- Dial ---------- */
  .dial {
    position: relative; height: 120px; border-radius: 14px;
    background: radial-gradient(ellipse at 50% 120%, #4a3818 0%, #2a2010 55%, #171108 100%);
    border: 5px solid #2a1709;
    box-shadow: inset 0 0 0 2px var(--brass2), inset 0 0 30px rgba(0,0,0,.9), 0 2px 0 rgba(255,220,170,.15);
    overflow: hidden;
  }
  .dial .glass {
    position:absolute; inset:0; opacity:0; transition: opacity 1.6s ease;
    background: radial-gradient(ellipse at 50% 110%, rgba(255,180,70,.55) 0%, rgba(255,150,50,.25) 40%, rgba(255,120,30,0) 75%);
  }
  .on .dial .glass { opacity: 1; }
  .dial .sheen {
    position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(165deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,.03) 30%, transparent 50%);
  }
  .scale { position:absolute; left:26px; right:26px; top:14px; height:46px; }
  .scale .band { position:absolute; left:0; right:0; top:22px; height:2px; background: var(--brass); opacity:.7; }
  .scale .tick { position:absolute; top:16px; width:2px; height:14px; background: var(--brass); opacity:.8; }
  .scale .tick.minor { top:19px; height:8px; width:1px; opacity:.55; }
  .scale .num { position:absolute; top:-2px; transform: translateX(-50%); font-size:12px; letter-spacing:1px; color: var(--brass); text-shadow: 0 0 6px rgba(255,180,80,.0); transition: text-shadow 1.6s; }
  .on .scale .num { text-shadow: 0 0 8px rgba(255,180,80,.8); }
  .scale .label { position:absolute; right:0; top:44px; font-size:9px; letter-spacing:3px; color: var(--brass); opacity:.7; }
  .scale .label.l { right:auto; left:0; }
  .needle {
    position:absolute; top:8px; bottom:46px; width:3px; left: 61%;
    background: linear-gradient(180deg, #ff6b4a, #c2281a); box-shadow: 0 0 6px rgba(255,80,50,.8);
    border-radius: 2px; transition: left 2.5s cubic-bezier(.3,.9,.3,1.1);
  }
  .needle::after { content:""; position:absolute; bottom:-6px; left:-5px; width:13px; height:13px; border-radius:50%; background:#c2281a; }

  /* now playing display */
  .display {
    position:absolute; left:26px; right:26px; bottom:8px; height:36px;
    border-radius: 6px; background: rgba(0,0,0,.45);
    box-shadow: inset 0 1px 4px rgba(0,0,0,.9), inset 0 0 0 1px rgba(216,178,90,.35);
    overflow:hidden; display:flex; align-items:center;
  }
  .display .text {
    white-space:nowrap; font-size:18px; letter-spacing:.5px; color:#ffd48a; padding-left:100%;
    text-shadow: 0 0 10px rgba(255,180,80,.9); opacity:.35; transition: opacity 1.6s;
    animation: marquee 18s linear infinite;
  }
  .on .display .text { opacity:1; }
  .display .text.static { padding-left:14px; animation:none; }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

  /* ---------- Lower deck ---------- */
  .deck { display:flex; gap:24px; margin-top:20px; height:196px; }
  .grille {
    flex:1; border-radius: 12px; position:relative;
    border: 6px solid #2a1709;
    box-shadow: inset 0 0 0 2px var(--brass2), inset 0 0 40px rgba(0,0,0,.8), 0 2px 0 rgba(255,220,170,.15);
    background:
      repeating-linear-gradient(45deg,  rgba(255,230,180,.07) 0 2px, transparent 2px 6px),
      repeating-linear-gradient(-45deg, rgba(255,230,180,.07) 0 2px, transparent 2px 6px),
      repeating-linear-gradient(0deg,   rgba(0,0,0,.25) 0 1px, transparent 1px 4px),
      radial-gradient(circle at 50% 50%, #5a4330 0%, #3a2a1c 60%, #2a1c12 100%);
  }
  .grille .bars { position:absolute; inset:14px; display:flex; justify-content:space-between; pointer-events:none; }
  .grille .bars i { width:10px; border-radius:5px; background: linear-gradient(90deg, var(--brass2), var(--brass) 45%, #f3dd9a 50%, var(--brass) 55%, var(--brass2)); box-shadow: 0 2px 4px rgba(0,0,0,.7); }
  .grille .plate {
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    padding:3px 12px; font-size:10px; letter-spacing:3px; color:#2a1c0e;
    background: linear-gradient(180deg, #f1d992, var(--brass) 60%, var(--brass2)); border-radius:3px;
    box-shadow: 0 1px 3px rgba(0,0,0,.8); white-space:nowrap; max-width:90%; overflow:hidden; text-overflow:ellipsis;
  }
  .grille .cone { /* subtle speaker pulse when playing */
    position:absolute; left:50%; top:46%; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
    background: radial-gradient(circle, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 70%); pointer-events:none;
  }
  .playing .grille .cone { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity:.6 } 50% { transform: scale(1.08); opacity:1 } }

  .controls { width:150px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding: 2px 0; }
  .knobwrap { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .knob {
    width:74px; height:74px; border-radius:50%; position:relative; cursor:grab;
    background:
      radial-gradient(circle at 35% 30%, #4a3a30 0%, #1c1612 55%, #0b0907 100%);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.18), inset 0 -3px 6px rgba(0,0,0,.8),
      0 6px 10px rgba(0,0,0,.8), 0 0 0 3px #1a110a, 0 0 0 5px var(--brass2);
    transition: transform .08s linear;
  }
  .knob::before { /* ridges */
    content:""; position:absolute; inset:4px; border-radius:50%;
    background: repeating-conic-gradient(rgba(255,255,255,.06) 0 4deg, transparent 4deg 10deg);
    -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%);
  }
  .knob .mark { position:absolute; left:50%; top:7px; width:4px; height:20px; margin-left:-2px; border-radius:2px; background: #f1e3b5; box-shadow:0 0 4px rgba(255,230,180,.6); }
  .knob:active { cursor:grabbing; }
  .knob.small { width:62px; height:62px; }
  .klabel { font-size:10px; letter-spacing:3px; color: var(--brass); opacity:.85; text-shadow: 0 1px 0 rgba(0,0,0,.8); }
  .knobwrap .scalearc { position:absolute; width:98px; height:98px; margin:-12px; border-radius:50%; pointer-events:none;
    background: repeating-conic-gradient(from 225deg, var(--brass) 0 1.2deg, transparent 1.2deg 27deg);
    -webkit-mask: radial-gradient(circle, transparent 46px, #000 47px, #000 49px, transparent 50px);
    opacity:.75; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 50%, 0 100%); }

  .lamp { width:12px; height:12px; border-radius:50%; background:#3a1a10; box-shadow: inset 0 1px 2px rgba(0,0,0,.9), 0 0 0 2px #1a110a, 0 0 0 3px var(--brass2); transition: background .4s, box-shadow .4s; }
  .lamp.connecting { background:#ffb020; box-shadow: 0 0 10px #ffb020, 0 0 0 2px #1a110a, 0 0 0 3px var(--brass2); animation: blink 1s infinite; }
  .lamp.playing { background:#5bff6a; box-shadow: 0 0 10px #5bff6a, 0 0 0 2px #1a110a, 0 0 0 3px var(--brass2); }
  .lamp.error { background:#ff3b2f; box-shadow: 0 0 10px #ff3b2f, 0 0 0 2px #1a110a, 0 0 0 3px var(--brass2); animation: blink .5s infinite; }
  @keyframes blink { 50% { opacity:.35 } }

  .brand { position:absolute; left:50%; bottom:6px; transform:translateX(-50%); font-size:11px; letter-spacing:5px; color:var(--brass); opacity:.75; text-shadow:0 1px 0 rgba(0,0,0,.9); }
  .feet { position:absolute; bottom:-10px; left:40px; right:40px; height:10px; display:flex; justify-content:space-between; }
  .feet i { width:40px; height:10px; background:#1a110a; border-radius:0 0 6px 6px; }
  .hint { position:absolute; top:6px; right:16px; font-size:10px; color:rgba(255,220,170,.35); letter-spacing:1px; }
  .msg { position:absolute; left:28px; bottom:6px; font-size:10px; color:rgba(255,120,90,.8); max-width:360px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div class="cabinet" id="cab">
  <div class="hint">Space: power · ↑↓ / wheel: volume</div>
  <div class="dial">
    <div class="glass"></div>
    <div class="scale" id="scale"><div class="band"></div><span class="label l">KC</span><span class="label">BROADCAST</span></div>
    <div class="needle" id="needle"></div>
    <div class="display"><div class="text static" id="np">— standby —</div></div>
    <div class="sheen"></div>
  </div>
  <div class="deck">
    <div class="grille">
      <div class="cone"></div>
      <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="plate" id="station">TRUE OLDIES CHANNEL</div>
    </div>
    <div class="controls">
      <div class="knobwrap">
        <div class="knob small" id="power" title="Power"><div class="mark"></div></div>
        <div class="klabel">POWER</div>
      </div>
      <div class="lamp" id="lamp"></div>
      <div class="knobwrap" style="position:relative">
        <div class="scalearc"></div>
        <div class="knob" id="vol" title="Volume"><div class="mark"></div></div>
        <div class="klabel">VOLUME</div>
      </div>
    </div>
  </div>
  <div class="brand">TRUE OLDIES CHANNEL</div>
  <div class="msg" id="msg"></div>
  <div class="feet"><i></i><i></i></div>
</div>

<script>
  // ---- dial scale ----
  (function () {
    const s = document.getElementById('scale');
    const nums = [55, 60, 70, 80, 100, 120, 140, 160];
    const pos = v => (Math.log(v / 55) / Math.log(160 / 55)) * 100;
    for (let v = 55; v <= 160; v += 5) {
      const t = document.createElement('i'); t.className = 'tick' + (v % 10 ? ' minor' : '');
      t.style.left = pos(v) + '%'; s.appendChild(t);
    }
    nums.forEach(v => { const n = document.createElement('span'); n.className = 'num'; n.textContent = v; n.style.left = pos(v) + '%'; s.appendChild(n); });
  })();

  const cab = document.getElementById('cab');
  const lamp = document.getElementById('lamp');
  const np = document.getElementById('np');
  const msg = document.getElementById('msg');
  const needle = document.getElementById('needle');
  const bridge = () => window.radio || { setVolume: () => {}, power: () => {}, state: async () => ({ on: false, volume: 0.8 }) };

  // ---- power knob ----
  let on = false;
  const powerKnob = document.getElementById('power');
  function renderPower() {
    powerKnob.style.transform = 'rotate(' + (on ? 60 : -60) + 'deg)';
    cab.classList.toggle('on', on);
    if (!on) { lamp.className = 'lamp'; cab.classList.remove('playing'); setNP('— standby —'); msg.textContent = ''; }
  }
  function togglePower() { on = !on; renderPower(); bridge().power(on); }
  powerKnob.addEventListener('click', togglePower);

  // ---- volume knob: 0..1 mapped to -135..+135 deg ----
  let vol = 0.8;
  const volKnob = document.getElementById('vol');
  function renderVol() { volKnob.style.transform = 'rotate(' + (-135 + vol * 270) + 'deg)'; }
  let pending = null;
  function setVol(v) {
    vol = Math.max(0, Math.min(1, v)); renderVol();
    if (!pending) pending = setTimeout(() => { pending = null; bridge().setVolume(vol); }, 30);
  }
  let drag = null;
  volKnob.addEventListener('mousedown', e => { drag = { y: e.clientY, x: e.clientX, v: vol }; e.preventDefault(); });
  window.addEventListener('mousemove', e => { if (!drag) return; const d = (drag.y - e.clientY) + (e.clientX - drag.x); setVol(drag.v + d / 200); });
  window.addEventListener('mouseup', () => drag = null);
  window.addEventListener('wheel', e => setVol(vol + (e.deltaY < 0 ? 0.04 : -0.04)), { passive: true });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePower(); }
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') setVol(vol + 0.04);
    if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') setVol(vol - 0.04);
  });

  // ---- display ----
  function setNP(text) {
    np.textContent = text;
    // scroll only if it doesn't fit
    np.classList.add('static');
    requestAnimationFrame(() => {
      const fits = np.scrollWidth <= np.parentElement.clientWidth - 20;
      np.classList.toggle('static', fits);
      np.style.animation = 'none'; void np.offsetWidth; np.style.animation = '';
      np.style.animationDuration = Math.max(10, text.length / 3) + 's';
    });
  }

  let gotTitle = false, titleTimer = null;
  // ---- events from Go ----
  window.onEvent = function (ev) {
    switch (ev.kind) {
      case 'state':
        if (ev.text === 'off') { on = false; renderPower(); return; }
        lamp.className = 'lamp ' + ev.text;
        cab.classList.toggle('playing', ev.text === 'playing');
        if (ev.text === 'connecting') { setNP('tuning in…'); msg.textContent = ''; needle.style.left = (40 + Math.random() * 35) + '%'; }
        if (ev.text === 'playing') { msg.textContent = ''; gotTitle = false; clearTimeout(titleTimer); titleTimer = setTimeout(() => { if (!gotTitle) setNP('♪ On the air — song info not provided by station'); }, 12000); }
        break;
      case 'title': gotTitle = true; setNP('♪ ' + ev.text); break;
      case 'station': document.getElementById('station').textContent = ev.text.toUpperCase(); break;
      case 'message': msg.textContent = ev.text; break;
    }
  };

  // ---- initial state ----
  (async () => {
    try { const s = await bridge().state(); vol = s.volume; on = s.on; } catch (e) {}
    renderVol(); renderPower();
    if (on) lamp.className = 'lamp connecting';
  })();
</script>
</body>
</html>
